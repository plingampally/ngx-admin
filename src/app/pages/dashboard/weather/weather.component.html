<nb-card size="medium">
  <nb-card-body>
    <span class="h3 location">BAC &middot; NYSE</span>
    <span class="date">Market open &middot; 15 min delayed</span>

    <div class="today">
      <span class="today-temperature h1">$47.82</span>
      <nb-icon icon="trending-up-outline" pack="eva" class="today-icon"></nb-icon>
    </div>

    <div class="today-details">
      <div class="parameter">
        <span class="caption parameter-name">chg</span>
        <span class="parameter-value">+1.24%</span>
      </div>
      <div class="parameter">
        <span class="caption parameter-name">high</span>
        <span class="parameter-value">$48.10</span>
      </div>
      <div class="parameter">
        <span class="caption parameter-name">low</span>
        <span class="parameter-value">$47.05</span>
      </div>
      <div class="parameter">
        <span class="caption parameter-name">vol</span>
        <span class="parameter-value">31.6M</span>
      </div>
    </div>

    <div class="weekly-forecast">
      <div class="day">
        <span class="caption">Fed funds</span>
        <i class="weather-icon ion-ios-analytics-outline"></i>
        <span class="temperature">4.25%</span>
      </div>
      <div class="day">
        <span class="caption">10Y UST</span>
        <i class="weather-icon ion-ios-pulse"></i>
        <span class="temperature">4.08%</span>
      </div>
      <div class="day">
        <span class="caption">EUR/USD</span>
        <i class="weather-icon ion-ios-world-outline"></i>
        <span class="temperature">1.084</span>
      </div>
      <div class="day">
        <span class="caption">VIX</span>
        <i class="weather-icon ion-ios-speedometer-outline"></i>
        <span class="temperature">14.2</span>
      </div>
    </div>
  </nb-card-body>
</nb-card>
